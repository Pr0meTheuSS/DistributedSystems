version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  mongo1:
    image: mongo:6
    container_name: mongo1
    ports:
      - 27017:27017
    volumes:
      - ./data/mongo1:/data/db
      - ./init:/docker-entrypoint-initdb.d
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    networks:
      - backend

  mongo2:
    image: mongo:6
    container_name: mongo2
    ports:
      - 27018:27017
    volumes:
      - ./data/mongo2:/data/db
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    networks:
      - backend
  
  mongo3:
    image: mongo:6
    container_name: mongo3
    ports:
      - 27019:27017
    volumes:
      - ./data/mongo3:/data/db
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    networks:
      - backend

  mongo-init:
    image: mongo:6-jammy
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    volumes:
      - ./init:/init
    entrypoint: ["bash", "-c", "sleep 5 && mongosh mongodb://mongo1:27017 /init/init.js"]
    networks:
      - backend

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_SERVER: mongo1
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo1,mongo2,mongo3:27017/?authSource=admin&replicaSet=rs0
    depends_on:
      - mongo1
      - mongo2
      - mongo3
        # condition: service_healthy
    networks:
      - backend

volumes:
  rabbitmq_data:
  mongo_data:

networks:
  backend:
